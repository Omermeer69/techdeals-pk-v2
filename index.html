<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDeals PK - Best Budget Gadgets 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card {
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }
        .product-img {
            transition: transform 0.6s ease;
        }
        .card:hover .product-img {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <!-- Navbar -->
    <nav class="bg-black/90 sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-purple-400">TechDeals<span class="text-white">PK</span></h1>
        </div>
    </nav>

    <!-- Hero -->
    <section class="bg-gradient-to-br from-purple-700 to-indigo-700 py-28 text-center">
        <h2 class="text-6xl font-bold mb-6">Pakistan Mein Sabse Best Budget Gadgets 2026</h2>
        <p class="text-2xl text-gray-200">Honest Reviews • Latest Deals on Daraz</p>
        
        <div class="max-w-2xl mx-auto mt-10 px-6">
            <input id="searchInput" type="text" placeholder="Search products... (earbuds, charger, watch etc)" 
                   class="w-full px-8 py-6 rounded-3xl bg-white/10 border border-white/30 focus:border-purple-400 text-lg placeholder-gray-400 focus:outline-none">
        </div>
    </section>

    <!-- Products -->
    <section class="max-w-7xl mx-auto px-6 py-20">
        <h2 class="text-5xl font-bold text-center mb-4">🔥 Trending Products</h2>
        <p class="text-center text-gray-400 mb-12">Pakistan mein sabse zyada bech rahe hain</p>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="productsContainer"></div>
    </section>

    <!-- WhatsApp -->
    <a href="https://wa.me/923000000000" target="_blank" class="fixed bottom-8 right-8 bg-green-500 w-16 h-16 rounded-3xl flex items-center justify-center text-4xl shadow-2xl hover:scale-110 z-50">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="bg-black py-12 text-center text-gray-400">
        <p>© TechDeals PK 2026 • Honest Reviews</p>
    </footer>

    <script>
        // Products Data (Yahan se aasani se add/remove kar sakte ho)
        let products = [
            {
                title: "Wireless Earbuds Pro",
                price: "₹2,499 - 4,999",
                rating: 4.6,
                desc: "Noise Cancellation • 40 Hours Battery",
                img: "https://picsum.photos/id/1015/800/600",
                link: "https://www.daraz.pk/catalog/?q=wireless+earbuds"
            },
            {
                title: "20000mAh Power Bank",
                price: "₹1,899 - 3,499",
                rating: 4.8,
                desc: "Fast Charging • LED Display",
                img: "https://picsum.photos/id/201/800/600",
                link: "https://www.daraz.pk/catalog/?q=power+bank+20000"
            },
            {
                title: "33W Fast Charger",
                price: "₹799 - 1,599",
                rating: 4.5,
                desc: "PD + QC Support • Original",
                img: "https://picsum.photos/id/180/800/600",
                link: "https://www.daraz.pk/catalog/?q=fast+charger"
            },
            {
                title: "Smart Watch Ultra",
                price: "₹3,499 - 6,999",
                rating: 4.4,
                desc: "Calling + Fitness Tracking",
                img: "https://picsum.photos/id/251/800/600",
                link: "https://www.daraz.pk/catalog/?q=smart+watch"
            }
        ];

        // Render Products
        function renderProducts(filteredProducts) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            filteredProducts.forEach(product => {
                const stars = '★'.repeat(Math.floor(product.rating));
                container.innerHTML += `
                    <div class="card bg-gray-900 rounded-3xl overflow-hidden border border-gray-800">
                        <img src="${product.img}" class="product-img w-full h-64 object-cover">
                        <div class="p-8">
                            <h3 class="text-2xl font-semibold">${product.title}</h3>
                            <div class="flex items-center gap-2 mt-3 text-yellow-400">
                                ${stars} <span class="text-gray-400">(${product.rating})</span>
                            </div>
                            <p class="text-green-400 text-3xl font-bold mt-4">${product.price}</p>
                            <p class="text-gray-400 mt-3">${product.desc}</p>
                            <a href="${product.link}" target="_blank" 
                               class="mt-8 block text-center bg-purple-600 hover:bg-purple-500 py-5 rounded-2xl font-medium">
                                Daraz Pe Khareedo →
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // Initial Render
        renderProducts(products);

        // Search Functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const term = this.value.toLowerCase();
            const filtered = products.filter(p => 
                p.title.toLowerCase().includes(term) || 
                p.desc.toLowerCase().includes(term)
            );
            renderProducts(filtered);
        });
    </script>
</body>
</html>
