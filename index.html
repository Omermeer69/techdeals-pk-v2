<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDeals PK - Best Budget Gadgets 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .card { transition: all 0.4s ease; }
        .card:hover { transform: translateY(-15px); }
        .product-img { transition: transform 0.6s; }
        .card:hover .product-img { transform: scale(1.08); }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <nav class="bg-black py-6 text-center border-b border-gray-800">
        <h1 class="text-4xl font-bold text-purple-400">TechDeals<span class="text-white">PK</span></h1>
    </nav>

    <section class="bg-gradient-to-br from-purple-700 to-indigo-700 py-24 text-center">
        <h2 class="text-5xl font-bold">Pakistan Mein Sabse Best Budget Gadgets 2026</h2>
        <p class="text-xl mt-4 text-gray-200">Honest Reviews • Daraz Special Deals</p>
        
        <!-- Search Bar -->
        <div class="max-w-xl mx-auto mt-10 px-6">
            <input id="searchInput" type="text" 
                   placeholder="Search karo... Earbuds, Power Bank, Charger..." 
                   class="w-full px-6 py-5 rounded-3xl bg-white/10 border border-white/30 focus:border-purple-400 text-white placeholder-gray-400 text-lg">
        </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-4xl font-bold text-center mb-12">🔥 Top Products</h2>
        
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="productsContainer"></div>
    </section>

    <!-- WhatsApp -->
    <a href="https://wa.me/923000000000" target="_blank" 
       class="fixed bottom-8 right-8 bg-green-500 w-16 h-16 rounded-3xl flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition z-50">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="bg-black py-12 text-center text-gray-400">
        <p>© TechDeals PK 2026 • Honest Reviews for Pakistan</p>
    </footer>

    <script>
        const products = [
            {title: "Wireless Earbuds Pro", price: "₹2,499 - 4,999", rating: "4.5", desc: "Noise Cancellation • 40H Battery", img: "https://picsum.photos/id/1015/600/400", link: "https://www.daraz.pk/catalog/?q=wireless+earbuds"},
            {title: "20000mAh Power Bank", price: "₹1,899 - 3,499", rating: "4.8", desc: "Fast Charging • LED Display", img: "https://picsum.photos/id/201/600/400", link: "https://www.daraz.pk/catalog/?q=power+bank+20000"},
            {title: "33W Fast Charger", price: "₹799 - 1,599", rating: "4.6", desc: "PD + QC Support", img: "https://picsum.photos/id/180/600/400", link: "https://www.daraz.pk/catalog/?q=fast+charger"},
            {title: "Smart Watch Ultra", price: "₹3,499 - 6,999", rating: "4.3", desc: "Calling + Fitness Tracking", img: "https://picsum.photos/id/251/600/400", link: "https://www.daraz.pk/catalog/?q=smart+watch"},
        ];

        const container = document.getElementById('productsContainer');
        products.forEach(p => {
            container.innerHTML += `
                <div class="card bg-gray-900 rounded-3xl overflow-hidden border border-gray-800">
                    <img src="${p.img}" class="product-img w-full h-56 object-cover">
                    <div class="p-6">
                        <h3 class="text-2xl font-semibold">${p.title}</h3>
                        <div class="flex items-center gap-1 mt-2 text-yellow-400">
                            ★★★★☆ <span class="text-gray-400 text-sm ml-2">(${p.rating})</span>
                        </div>
                        <p class="text-green-400 text-3xl font-bold mt-3">${p.price}</p>
                        <p class="text-gray-400 mt-2">${p.desc}</p>
                        <a href="${p.link}" target="_blank" class="mt-6 block text-center bg-purple-600 hover:bg-purple-500 py-4 rounded-2xl">Daraz Pe Khareedo →</a>
                    </div>
                </div>
            `;
        });

        // Search
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const term = this.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
