<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDeals PK - Best Budget Gadgets 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .hero-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
        }
        
        .card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-20px) scale(1.03);
            box-shadow: 0 30px 60px -15px rgb(0 0 0 / 0.5);
        }
        
        .product-img {
            transition: transform 0.8s ease;
        }
        .card:hover .product-img {
            transform: scale(1.12);
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <!-- Navbar -->
    <nav class="bg-black/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">TechDeals<span class="text-white">PK</span></h1>
            <div class="hidden md:flex gap-8 font-medium">
                <a href="#products" class="hover:text-purple-400">Products</a>
                <a href="#" class="hover:text-purple-400">Deals</a>
                <a href="#" class="hover:text-purple-400">Reviews</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-bg py-32 text-center relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6">
            <h2 class="text-6xl md:text-7xl font-bold leading-tight mb-6">
                Pakistan Mein Sabse <span class="text-yellow-300">Best Budget Gadgets</span> 2026
            </h2>
            <p class="text-2xl text-gray-100 mb-10">Honest Reviews • Real Prices • Daraz Special Deals</p>
            
            <!-- Search Bar -->
            <div class="max-w-2xl mx-auto">
                <input id="searchInput" type="text" placeholder="Search karo... Earbuds, Power Bank, Charger, Smart Watch..." 
                       class="glass w-full px-8 py-6 rounded-3xl text-lg border border-white/20 focus:border-purple-400 focus:outline-none placeholder-gray-300">
            </div>
        </div>
    </section>

    <!-- Products -->
    <section id="products" class="max-w-7xl mx-auto px-6 py-24">
        <h2 class="text-5xl font-bold text-center mb-4">🔥 Top Selling Products</h2>
        <p class="text-center text-gray-400 mb-16">Pakistan mein sabse zyada bechne wale gadgets</p>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-10" id="productsContainer"></div>
    </section>

    <!-- WhatsApp -->
    <a href="https://wa.me/923000000000" target="_blank" 
       class="fixed bottom-8 right-8 bg-green-500 w-16 h-16 rounded-3xl flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition z-50">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="bg-black py-16 text-center text-gray-400 border-t border-gray-800">
        <p class="text-lg">© TechDeals PK 2026 • Honest Reviews for Pakistan</p>
    </footer>

    <script>
        const products = [
            {title: "Wireless Earbuds Pro", price: "₹2,499 - 4,999", rating: "4.6", desc: "Noise Cancellation • 40H Battery • Deep Bass", img: "https://picsum.photos/id/1015/800/600", link: "https://www.daraz.pk/catalog/?q=wireless+earbuds"},
            {title: "20000mAh Power Bank", price: "₹1,899 - 3,499", rating: "4.8", desc: "Fast Charging • LED Display • Strong Build", img: "https://picsum.photos/id/201/800/600", link: "https://www.daraz.pk/catalog/?q=power+bank+20000"},
            {title: "33W Fast Charger", price: "₹799 - 1,599", rating: "4.5", desc: "PD + QC Support • Original Quality", img: "https://picsum.photos/id/180/800/600", link: "https://www.daraz.pk/catalog/?q=fast+charger"},
            {title: "Smart Watch Ultra", price: "₹3,499 - 6,999", rating: "4.4", desc: "Calling + Fitness + Notifications", img: "https://picsum.photos/id/251/800/600", link: "https://www.daraz.pk/catalog/?q=smart+watch"},
            {title: "Bluetooth Neckband", price: "₹1,299 - 2,499", rating: "4.7", desc: "Long Battery • Magnetic Design", img: "https://picsum.photos/id/60/800/600", link: "https://www.daraz.pk/catalog/?q=neckband"},
            {title: "Wireless Mouse + Keyboard", price: "₹1,899 - 3,299", rating: "4.3", desc: "Rechargeable • Silent Click", img: "https://picsum.photos/id/180/800/600", link: "https://www.daraz.pk/catalog/?q=wireless+mouse"}
        ];

        const container = document.getElementById('productsContainer');

        products.forEach(p => {
            container.innerHTML += `
                <div class="card bg-gray-900 rounded-3xl overflow-hidden border border-gray-800">
                    <img src="${p.img}" class="product-img w-full h-72 object-cover">
                    <div class="p-8">
                        <h3 class="text-2xl font-semibold">${p.title}</h3>
                        <div class="flex items-center gap-2 mt-3">
                            <span class="text-yellow-400 text-2xl">★</span>
                            <span class="text-gray-400">${p.rating}</span>
                        </div>
                        <p class="text-green-400 text-3xl font-bold mt-3">${p.price}</p>
                        <p class="text-gray-400 mt-4">${p.desc}</p>
                        <a href="${p.link}" target="_blank" class="mt-8 block text-center bg-purple-600 hover:bg-purple-500 py-5 rounded-2xl font-medium text-lg">Daraz Pe Khareedo →</a>
                    </div>
                </div>
            `;
        });

        // Search Functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const term = this.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
